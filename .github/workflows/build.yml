name: Build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Package (universal APK)
        run: |
          base_version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          date_tag=$(date +%Y%m%d)
          out="build/Han1mePlus-v${base_version}-android-${date_tag}.apk"
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk "$out"
          echo "APK_PATH=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/*.apk
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Package (zip)
        shell: pwsh
        run: |
          $version = ((Get-Content pubspec.yaml | Select-String '^version:').Line -split '\s+')[1].Split('+')[0]
          $date = Get-Date -Format yyyyMMdd
          $out = "Han1mePlus-v$version-windows-x64-$date"
          flutter build windows --release
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "build/$out.zip"
          "ZIP_PATH=build/$out.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: build/*.zip
          if-no-files-found: error

  ios:
    name: iOS (unsigned IPA)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Package (unsigned IPA)
        run: ./scripts/package_ipa.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/*.ipa
          if-no-files-found: error

  macos:
    name: macOS (ARM DMG)
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.2
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Package (ARM DMG with Applications link)
        run: ./scripts/package_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: build/*.dmg
          if-no-files-found: error

  release:
    name: Release (on tag)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, ios, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
